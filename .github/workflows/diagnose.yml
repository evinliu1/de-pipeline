name: Diagnose failures

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of a failed run to diagnose
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          model: ${{ vars.DE_PIPELINE_MODEL }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
