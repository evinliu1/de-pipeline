name: Diagnose failures

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of a failed run to diagnose
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync

      - name: Diagnose the failed run
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DE_PIPELINE_MODEL: ${{ vars.DE_PIPELINE_MODEL }}
        run: |
          uv run python -m de_pipeline.explain --run-id "$RUN_ID" --format markdown --comment \
            | tee -a "$GITHUB_STEP_SUMMARY"
