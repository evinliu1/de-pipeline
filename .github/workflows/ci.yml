name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  content: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync
      
      - name: Run tests
        run: uv run pytest 2>&1 | tee test.log
      
      - name: Explain the failure
        if: failure()
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DE_PIPELINE_MODEL: ${{ vars.DE_PIPELINE_MODEL }}
        run: uv run python -m de_pipeline.explain test.log | tee -a "$GITHUB_STEP_SUMMARY"